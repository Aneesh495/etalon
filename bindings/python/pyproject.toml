[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pyetalon"
version = "1.0.0"
description = "High-performance Python interface to the Etalon Carrier-Grade DWDM and OTN Engine"
readme = "README.md"
authors = [{ name = "Aneesh Krishna" }]
license = { text = "MIT" }
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Telecommunications Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Networking",
]
keywords = ["dwdm", "otn", "optical-networks", "traffic-engineering", "itu-t-g709"]
dependencies = []

[project.scripts]
etalon-cli = "pyetalon.cli:main"
